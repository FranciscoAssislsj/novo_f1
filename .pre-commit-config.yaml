# Hooks executados antes de cada commit.
# Instalação: poetry run pre-commit install
# Rodar em todos os arquivos: poetry run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml usa tags customizadas (!!python/name)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Ruff via Poetry para usar exatamente a versão travada no poetry.lock
  # (a mesma que roda no CI).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (formatação)
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: poetry-check
        name: poetry check --lock
        entry: poetry check --lock
        language: system
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
