[project]
name = "novo-f1"
version = "0.1.0"
description = "Dashboard Streamlit para explorar dados históricos de Fórmula 1 da OpenF1 API, com cache local em Parquet."
authors = [
    {name = "Francisco de Assis",email = "franciscofut25@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "streamlit (>=1.66.0,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "novo_f1", from = "src"}]

[tool.poetry.group.docs]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)"
]
docs = [
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings[python] (>=1.0.7,<2.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erros)
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes
    "I",    # isort (ordenação de imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # regras específicas do Ruff
]

[tool.ruff.lint.per-file-ignores]
# Páginas Streamlit usam prefixo numérico (1_Calendario.py) para definir a ordem
# da navegação; são executadas por caminho e nunca importadas como módulo.
"src/novo_f1/dashboard/views/*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["novo_f1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=novo_f1",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["novo_f1"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
